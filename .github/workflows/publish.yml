name: publish

# Monthly rebuild (security updates), on Dockerfile changes, or manually.
on:
  schedule:
    - cron: "0 4 1 * *"   # 1st of every month, 04:00 UTC
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/publish.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: gokhanofficial/geek-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM'}}

      # arm64 is built under QEMU emulation (only apk/unpack work, so it stays fast).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Without the secrets (e.g. a fork) the image is built but not pushed.
      - id: creds
        run: echo "ok=${{ secrets.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ steps.creds.outputs.ok == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
